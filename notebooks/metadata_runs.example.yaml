# Template for notebooks/metadata_runs.yaml (gitignored) — copy this file
# there and edit freely; changes to the copy never show up as notebook diffs.
#
# theta_true_path: path to a single theta_true.h5 holding a `theta` group with
#                  one dataset per parameter, each shape (nbins,). This is the
#                  ONLY source of truth lines and corner markers in the
#                  notebook — no per-run mock lookup, and never theta0 (the
#                  whitening centre, which equals the truth only for runs
#                  started at truth).
# output_dirs:     one Outputs_* directory per run (each must contain samples.h5
#                  and mcmc_metadata.h5; sampler type is auto-detected per directory).
# run_labels:      optional, one label per run; omit or set to null to
#                  auto-generate "Run 0", "Run 1", ...

theta_true_path: /spiff/ssage/karmma_data/theta_true.h5

output_dirs:
  - /spiff/ssage/karmma_data/LN_dg_RS_linmu_bias/Outputs_400
  - /spiff/ssage/karmma_data/LN_dg_RS_linmu_bias/Outputs_MCLMC

run_labels:
  - NUTS
  - MCLMC
