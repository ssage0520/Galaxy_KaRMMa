name: jax_karmma
channels:
  - conda-forge
dependencies:
  - python=3.12
  - jax=0.10.2
  - jaxlib=0.10.2
  - blackjax=1.6.2
  - ducc0=0.41.0
  - getdist=1.7.7
  - pyccl=3.3.6
  - namaster=3.0
  - skyproj=2.5.0
  - treecorr=5.1.3
  - healpy=1.20.0
  - h5py=3.16.0
  - numpy=2.5.1
  - scipy=1.18.0
  - matplotlib=3.11.1
  - pypalettes=0.2.1
  - astropy=8.0.1
  - pandas=3.0.5
  - pyyaml=6.0.3
  - ipykernel=7.3.0
  - tqdm=4.70.0
  - joblib=1.5.3
  - ruff=0.16.0
  - nbstripout=0.9.1
  - pip
  - pip:
      # Required for blackjax.progress_bar(); not on conda-forge.
      - jax-tap>=0.3.0
      # Required for the jaxbind-based SHT primitive in karmma.transforms; not on conda-forge.
      - jaxbind>=1.3.1
